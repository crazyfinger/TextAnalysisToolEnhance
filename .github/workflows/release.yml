name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build Release
        run: dotnet build src/TextAnalysisTool.NET.csproj -c Release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TextAnalysisTool.NET.exe
          generate_release_notes: true